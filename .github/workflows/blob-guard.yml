name: blob-guard

# Reject pull requests that introduce files larger than 1 MiB, so demo media /
# binaries can't bloat the repo's pack again (audit §1). Only files changed by
# the PR are checked, so the existing media debt doesn't fail unrelated PRs.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-blob-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for oversized blobs
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "$base_ref"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${base_ref}...HEAD")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No added/modified files to check."
            exit 0
          fi
          printf 'Checking %d changed file(s)...\n' "${#files[@]}"
          python3 scripts/check_blob_size.py "${files[@]}"
