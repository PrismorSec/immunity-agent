name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Release
  id-token: write   # OIDC token for PyPI trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build prismor
        run: |
          pip install hatchling build
          python -m build --outdir dist

      - name: Sync immunity-agent shim version with prismor
        # The shim's version/dependency floor are hand-maintained in
        # packaging/immunity-agent-shim/pyproject.toml — a manual step that
        # was previously missed on a release, causing "400 File already
        # exists" when PyPI rejected re-uploading the prior version. Derive
        # it from prismor/runtime/__init__.py instead of trusting it stayed
        # in sync.
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' prismor/runtime/__init__.py)
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packaging/immunity-agent-shim/pyproject.toml
          sed -i "s/prismor>=[0-9][0-9.]*/prismor>=$VERSION/" packaging/immunity-agent-shim/pyproject.toml
          echo "Synced immunity-agent shim to version $VERSION"
          grep -E "^version|prismor>=" packaging/immunity-agent-shim/pyproject.toml

      - name: Build immunity-agent redirect package
        run: python -m build packaging/immunity-agent-shim --outdir dist-shim

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            dist-shim/*

      - name: Publish prismor to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Publish immunity-agent redirect to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-shim
          skip-existing: true

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

