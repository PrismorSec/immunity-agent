name: Release

# Publish job. release-please.yml (triggered on every push to main) owns
# version bumps + CHANGELOG.md; merging its release PR creates the `vX.Y.Z`
# tag and a GitHub Release, which fires this workflow's `release: published`
# event. This job validates that release, builds the PyPI packages + the
# portable tar.gz/zip bundle, attaches them to the release release-please
# already created, and publishes to PyPI.

on:
  release:
    types: [published]

permissions:
  contents: write   # attach build artifacts to the GitHub Release
  id-token: write   # OIDC token for PyPI trusted publishing

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag / CHANGELOG.md / __version__ agree
        run: python3 scripts/validate_release.py "${{ github.event.release.tag_name }}"

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build prismor
        run: |
          pip install hatchling build
          python -m build --outdir dist

      - name: Sync immunity-agent shim version with prismor
        # The shim's version/dependency floor are hand-maintained in
        # packaging/immunity-agent-shim/pyproject.toml — a manual step that
        # was previously missed on a release, causing "400 File already
        # exists" when PyPI rejected re-uploading the prior version. Derive
        # it from prismor/runtime/__init__.py instead of trusting it stayed
        # in sync.
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' prismor/runtime/__init__.py)
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packaging/immunity-agent-shim/pyproject.toml
          sed -i "s/prismor>=[0-9][0-9.]*/prismor>=$VERSION/" packaging/immunity-agent-shim/pyproject.toml
          echo "Synced immunity-agent shim to version $VERSION"
          grep -E "^version|prismor>=" packaging/immunity-agent-shim/pyproject.toml

      - name: Build immunity-agent redirect package
        run: python -m build packaging/immunity-agent-shim --outdir dist-shim

      - name: Build portable macOS/Linux bundle
        run: scripts/build_portable.sh dist-portable

      - name: Attach build artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*
            dist-shim/*
            dist-portable/*

      - name: Publish prismor to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Publish immunity-agent redirect to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-shim
          skip-existing: true
