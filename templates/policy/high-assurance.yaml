# Prismor policy template — High Assurance
# summary: Deny by default. Every surface enforcing, shell sandboxed, nothing implicit.
#
# Use when: the agent is autonomous, long-running, or handling material where a
# single bad action is unacceptable — and you would rather it stop and ask than
# guess right. This is the strictest shipped template. Expect friction on day
# one; that is the trade being made, not a bug to tune away.
#
# What it turns on that the other templates do not:
#   * Docker-backed shell sandboxing — allowed commands still run in a
#     container with no network and a read-only root, so an ALLOWED command
#     that turns out to be wrong is contained too.
#   * `egress.default: deny` — a destination not on the list is refused, so
#     exfiltration to a host nobody thought to blacklist is not possible.
#   * `execution_target_action: enforce` — indirection through a script,
#     Makefile or Dockerfile does not launder a command past the rules.
#
# Do not adopt this cold. Run `observe-first` for a week, read
# `prismor egress report`, and paste your real destinations into the allow list
# below. Deploying a deny-by-default egress policy with a guessed allowlist
# produces an agent that cannot work and a team that turns Prismor off.
version: "1.0"

settings:
  default_mode: enforce

  egress:
    enabled: true
    mode: enforce
    default: deny
    allow_private: false      # not even localhost without saying so
    resolve: true             # a hostname is re-checked against what it resolves to
    allow:
      - "api.anthropic.com"
      - "api.openai.com"
      # Add YOUR destinations here — see `prismor egress report`.
    deny:
      - host: "*"
        ports: [4444, 1337, 9001, 31337]
        reason: "common reverse-shell ports"

  sandbox:
    enabled: true
    backend: docker
    mode: enforce
    image: python:3.12-slim
    workdir: /workspace
    network: none
    workspace_mount: rw
    read_only_root: true
    resource_limits:
      cpus: "1.0"
      memory: 1g
      pids_limit: 256
      timeout_seconds: 300

  inspect_execution_targets: true
  execution_target_action: enforce

  supply_chain_install_check: true
  supply_chain_transitive_scan: true
  mcp_transport_action: block

  tool_tags:
    enabled: true
    mode: enforce
    # Even here, off. Inference tags every shell/write `critical_action` and
    # every read `untrusted_content`, which turns the first rule below into
    # "no command may follow a file read" — that is not strictness, it is an
    # agent that cannot work. Tag your consequential tools explicitly instead.
    inference_enabled: false
    rules:
      - "untrusted_content then critical_action -> block"
      - "untrusted_content then egress.offlist -> block"
      - "untrusted_content then egress.denied -> block"
      - "untrusted_content then data.secret -> block"

  semantic_guard:
    enabled: true
    mode: auto
    warn_threshold: 0.35      # tighter than the default 0.45
    block_threshold: 0.65     # tighter than the default 0.75

  data_boundary:
    enabled: true
    mode: enforce
    classes:
      email:  {external: step_up, untrusted: block, unknown: step_up}
      phone:  {external: step_up, untrusted: block, unknown: step_up}
      ssn:    {trusted: block, external: block, untrusted: block, unknown: block}
      card:   {trusted: block, external: block, untrusted: block, unknown: block}
      iban:   {trusted: block, external: block, untrusted: block, unknown: block}
      secret: {trusted: step_up, external: block, untrusted: block, unknown: block}
      file:   {external: step_up, untrusted: block, unknown: step_up}
    bulk_threshold: 3
    unknown_cli: step_up

rules:
  # Promote every warn-by-default rule that has a real consequence. Rules
  # already blocking under the safety floor are not repeated here.
  - id: db-access
    mode: enforce
  - id: db-modification
    mode: enforce
  - id: path-traversal
    mode: enforce
  - id: risky-write
    mode: enforce
  - id: raw-ip-outbound
    mode: enforce
  # NOT promoted: `network-exfil-tool` matches any `curl -d/-F/--upload-file`,
  # so in enforce it blocks every outbound POST — including one to a host this
  # template's own allow list names. `egress.default: deny` already bounds the
  # destination set far more precisely, which is the whole point of this file.
  - id: network-exfil-tool
    mode: observe
  - id: bind-all-interfaces
    mode: enforce
  - id: reverse-tunnel
    mode: enforce
  - id: tls-verification-disabled
    mode: enforce
  - id: persistence-cron
    mode: enforce
  - id: persistence-systemd
    mode: enforce
  - id: persistence-init
    mode: enforce
  - id: persistence-shell-profile
    mode: enforce
  - id: persistence-git-hooks
    mode: enforce
  - id: persistence-launch-agent
    mode: enforce
  - id: memory-embedded-directive
    mode: enforce
  - id: memory-exfil-directive
    mode: enforce
  - id: memory-tool-policy-override
    mode: enforce
  - id: memory-invisible-text
    mode: enforce
  - id: agent-instruction-tampering
    mode: enforce
  - id: pii-exposure
    mode: enforce
  - id: model-manipulation
    mode: enforce
  - id: pkg-install-from-url
    mode: enforce
  - id: pkg-install-unsafe-flags
    mode: enforce
  - id: pkg-install-global
    mode: enforce
  - id: pkg-suspicious-name
    mode: enforce
  - id: pkg-postinstall-script
    mode: enforce
  - id: dependency-confusion
    mode: enforce
  - id: npm-git-install
    mode: enforce
  - id: lockfile-direct-edit
    mode: enforce
  - id: git-remote-hijack
    mode: enforce
  - id: python-network-exfil
    mode: enforce
  - id: skill-behavior-manipulation
    mode: enforce
  - id: skill-overpermission
    mode: enforce
  - id: skill-self-persist
    mode: enforce

# ── Customize ───────────────────────────────────────────────────────────────
# The two lines that decide whether this is usable:
#
#   settings.egress.allow      your real destinations
#   settings.sandbox.enabled   requires a working Docker daemon
#
# Check the sandbox before you rely on it — with Docker missing, verify what
# the fallback does on your install rather than assuming containment:
#
#   prismor sandbox check
#   prismor sandbox status
#
# To relax one rule without leaving this template, override its mode:
#
# rules:
#   - id: risky-write
#     mode: observe
#
# The safety floor (rm -rf /, reverse shells, secret exfiltration, privilege
# escalation, tampering with Prismor's own config) enforces regardless — there
# is nothing to add here for it and nothing that can take it away.
