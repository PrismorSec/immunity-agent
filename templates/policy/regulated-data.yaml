# Prismor policy template — Regulated Data
# summary: Health, financial or customer PII in the repo. Sensitive values may not leave.
#
# Use when: the agent works in a codebase that touches PHI, cardholder data, or
# customer PII — healthcare, fintech, insurance, anything under HIPAA / PCI-DSS
# / GDPR. The controls other templates spend on the machine, this one spends on
# the data: what an outbound call CARRIES, not just which host it reaches.
#
# The shape this defends against is mundane, not exotic. An agent debugging a
# failing test pastes a row into a support form. A setup guide says
# `vendor login --email <your email>` and the agent obliges. A stack trace with
# a card number goes to an error-reporting endpoint. No prompt injection
# required — the agent is being helpful.
#
# `redact` rewrites the call where the value is a URL parameter or body field;
# where it is a CLI flag it falls back to `step_up` (an inline approval) rather
# than silently dropping a required argument.
version: "1.0"

settings:
  default_mode: enforce

  data_boundary:
    enabled: true
    mode: enforce

    # Your own domains. Sending customer data here is the application working.
    trusted_domains: []
    #   - "*.mycorp.com"
    #   - "api.internal.mycorp.com"

    classes:
      # Regulated identifiers never leave, not even to a trusted vendor — that
      # decision belongs to a BAA/DPA review, not to an agent mid-task.
      ssn:    {internal: observe, trusted: block, external: block, untrusted: block, unknown: block}
      card:   {internal: observe, trusted: block, external: block, untrusted: block, unknown: block}
      iban:   {internal: observe, trusted: block, external: block, untrusted: block, unknown: block}
      # Credentials: a vendor's own key to that vendor is fine, anywhere else is not.
      secret: {trusted: warn, external: block, untrusted: block, unknown: block}
      # Contact data is redactable — the call still goes, the value does not.
      email:  {trusted: observe, external: redact, untrusted: block, unknown: step_up}
      phone:  {trusted: observe, external: redact, untrusted: block, unknown: step_up}
      # Whole files leaving the machine get a human in the loop.
      file:   {trusted: observe, external: step_up, untrusted: block, unknown: step_up}

    # Three distinct values of one class in a single call is a dataset, not a
    # debug paste. Lower than the default 10 because in a regulated repo the
    # bulk case is the reportable one.
    bulk_threshold: 3

    # An unrecognised CLI whose destination cannot be read from argv is screened
    # as external rather than waved through.
    unknown_cli: step_up

  # PII findings in commands and file content, not just outbound calls.
  egress:
    enabled: true
    mode: enforce
    default: allow

rules:
  # `network-exfil-tool` matches any `curl -d/-F/--upload-file`, which under
  # `default_mode: enforce` means every outbound POST — including the one to
  # your own mail vendor that `data_boundary.per_domain` explicitly allows.
  # Demoted because in THIS template the precise control is the data boundary:
  # it screens what the call carries against where it is going, which is the
  # actual question. Measured: this rule alone blocked a legitimate
  # `POST https://api.resend.com/emails`.
  - id: network-exfil-tool
    mode: observe

  - id: pii-exposure
    mode: enforce
  - id: bulk-pii-exfiltration
    mode: enforce
    action: block
  - id: db-access
    mode: enforce
  - id: db-modification
    mode: enforce
  # A production dump landing in the working tree is how PHI escapes a
  # compliance boundary without anyone sending anything.
  - id: risky-write
    mode: enforce

  # Data-class detection is regex, and regional identifiers are not in the
  # default set. Add yours rather than hoping the generic patterns catch them.
  - id: national-id-uk-nino
    severity: HIGH
    category: pii_exposure
    title: UK National Insurance number in an agent action
    event_types: [shell, file_write, network]
    fields: [command, content, url, outbound_payload]
    patterns:
      - '\b[A-CEGHJ-PR-TW-Z]{2}\s?\d{2}\s?\d{2}\s?\d{2}\s?[A-D]\b'
    action: block

  - id: mrn-medical-record-number
    severity: HIGH
    category: pii_exposure
    title: Medical record number pattern in an agent action
    event_types: [shell, file_write, network]
    fields: [command, content, url, outbound_payload]
    patterns:
      - '\b(?:MRN|mrn)[-_:\s#]{0,3}\d{6,10}\b'
    action: block

# ── Customize ───────────────────────────────────────────────────────────────
# 1. Fill in `trusted_domains` FIRST. Without it every one of your own services
#    is scored `external`, and this template will feel unusable.
#
# 2. Vendors that receive customer contact data by design (your mail provider,
#    your CRM) are already carved out in the shipped defaults under
#    `data_boundary.per_domain` — those entries survive this file, because
#    nested maps merge key by key. Add your own the same way:
#
#    settings:
#      data_boundary:
#        per_domain:
#          "*.myvendor.com": {email: allow, phone: allow}
#
# 3. Replace the two example identifier rules with the formats you actually
#    hold, and check them against your own corpus before enforcing:
#
#      prismor policy validate .prismor/policy.yaml
#      prismor policy test              # add cases to .prismor/policy-tests.yaml
#
#    A national-ID regex that also matches your build IDs will block every
#    build. Measure the false-positive rate in `mode: observe` first.
