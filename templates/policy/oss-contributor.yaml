# Prismor policy template — Open Source Contributor
# summary: Public repo, untrusted PRs and third-party packages. Supply chain first.
#
# Use when: the agent works on a public repository — reviewing contributor pull
# requests, triaging issues, adding dependencies, running the test suite. The
# machine is a developer laptop, so this template is deliberately quieter than
# the enforcing ones: the goal is to stay out of the way of normal work and
# stop exactly two things.
#
#   1. A dependency that should not be installed. Typosquats, packages pinned
#      by editing a manifest, installs straight from a URL or a git ref,
#      postinstall scripts. This is how a maintainer's laptop gets owned, and
#      it happens during ordinary work with no attacker interaction.
#
#   2. Contributor-supplied content acting as instructions. A PR description, a
#      test fixture, or a checked-in SKILL.md is attacker-controlled text that
#      an agent will happily read as guidance.
#
# Everything else — db access, network shape, writes — stays in observe, so a
# maintainer is not fighting the tool while merging a docs typo.
version: "1.0"

settings:
  # Quiet by default: only the rules promoted below block.
  default_mode: observe

  supply_chain_install_check: true
  supply_chain_transitive_scan: true

  # `npm test` running a script that curls something is the interesting case,
  # and it is invisible without this. Report it, do not block a test run.
  inspect_execution_targets: true
  execution_target_action: observe

  egress:
    enabled: true
    mode: observe
    default: allow

  tool_tags:
    enabled: true
    mode: enforce
    # Off, or the rule below reads as "no command may follow a file read" —
    # inference tags every shell/write `critical_action` and every read
    # `untrusted_content`. See docs/policy-templates.md.
    inference_enabled: false
    rules:
      # Read a contributor's issue/PR, then push, publish or send. The classic
      # "helpful agent implements the injected instruction" path.
      - "untrusted_content then critical_action -> block"
      - "untrusted_content then egress.denied -> block"

  semantic_guard:
    enabled: true
    mode: auto

rules:
  # ── Dependency integrity ───────────────────────────────────────────────────
  - id: pkg-install-from-url
    mode: enforce
  - id: pkg-suspicious-name
    mode: enforce
  - id: pkg-postinstall-script
    mode: enforce
  - id: dependency-confusion
    mode: enforce
  - id: npm-git-install
    mode: enforce
  # Both match SHELL edits of a lockfile (sed/echo/vim). A lockfile rewritten
  # through the agent's own Write tool is reported by `risky-write`, which stays
  # in observe here because it also covers package.json — and a maintainer edits
  # that legitimately several times a day.
  - id: lockfile-direct-edit
    mode: enforce
  - id: lockfile-deletion
    mode: enforce
  - id: execute-vendored-script
    mode: enforce
  - id: package-registry-poisoning
    mode: enforce

  # ── Contributor content treated as instructions ────────────────────────────
  - id: prompt-injection
    mode: enforce
  - id: prompt-injection-hidden
    mode: enforce
  - id: skill-exfil-url
    mode: enforce
  - id: skill-encoded-payload
    mode: enforce
  - id: skill-shell-injection
    mode: enforce
  - id: skill-dynamic-import
    mode: enforce
  - id: skill-prompt-override
    mode: enforce

  # ── Maintainer credentials ─────────────────────────────────────────────────
  # An npm/PyPI publish token or a signing key on a maintainer's laptop is the
  # highest-value secret in the whole open-source supply chain.
  - id: secret-access
    mode: enforce
  - id: credential-aggregation
    mode: enforce
  - id: git-remote-hijack
    mode: enforce

  # Rewriting the release branch is not something an agent should do on its own.
  - id: persistence-git-hooks
    mode: enforce

# ── Customize ───────────────────────────────────────────────────────────────
# Fixtures in a security-focused repo trip the injection and skill rules by
# design — the test data IS attack strings. Carve the fixture directory out
# rather than turning the rules off:
#
# allowlists:
#   - id: allow-security-fixtures
#     rule_ids: ["prompt-injection", "prompt-injection-hidden", "skill-encoded-payload"]
#     patterns: ["tests/fixtures/attacks/", "testdata/malicious/"]
#     reason: "adversarial corpus — these strings are the test input"
#
# If your project vendors a build script that must run, name it precisely:
#
# allowlists:
#   - id: allow-vendored-configure
#     rule_ids: ["execute-vendored-script"]
#     patterns: ["\\./scripts/configure\\.sh"]
#     reason: "checked-in build entrypoint, reviewed"
#
# Run `prismor policy show` after editing to see the merged result, and
# `prismor sessions` after a week to find which rule is actually noisy for you.
