# Prismor policy template — CI Agent
# summary: Unattended agent in CI/CD. Nothing can prompt a human, so ambiguity blocks.
#
# Use when: an agent runs in GitHub Actions, GitLab CI, Jenkins, or any other
# pipeline with no human at the keyboard. Two things change versus an
# interactive laptop:
#
#   1. `step_up` (inline approval) has nobody to ask, so this template resolves
#      those decisions to `block` instead of leaving them to time out.
#   2. The destination set is small and known — a build talks to your VCS host,
#      your package registries and your own services. Anything else is a
#      finding, which makes `egress.default: deny` practical here even when it
#      would be painful on a developer machine.
#
# Runner secrets (GITHUB_TOKEN, deploy keys, cloud OIDC creds) are in the
# process environment, so exfiltration rules run in enforce.
version: "1.0"

settings:
  default_mode: enforce

  egress:
    enabled: true
    mode: enforce
    default: deny
    allow_private: true          # talking to service containers on localhost is normal
    allow:
      - "*.github.com"
      - "github.com"
      - "*.githubusercontent.com"
      - "*.gitlab.com"
      - "registry.npmjs.org"
      - "*.npmjs.org"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "crates.io"
      - "static.crates.io"
      - "proxy.golang.org"
      - "*.docker.io"
      - "*.docker.com"
      - "ghcr.io"
      - "api.anthropic.com"
      - "api.openai.com"
    deny:
      - host: "*"
        ports: [4444, 1337, 9001]
        reason: "common reverse-shell ports — no build needs them"

  # A build script is the whole attack surface: `bash deploy.sh` says nothing
  # about what deploy.sh does. Enforce on inspected content, not just observe.
  inspect_execution_targets: true
  execution_target_action: enforce

  # A pipeline pulling a malicious or typosquatted package is the single most
  # likely way a CI agent gets owned. Both checks on, and insecure remote MCP
  # transports fail the build rather than warning into a log nobody reads.
  supply_chain_install_check: true
  supply_chain_transitive_scan: true
  mcp_transport_action: block

  # No human to approve, so send-decisions resolve rather than hang. `block`
  # everywhere `step_up` would have been used interactively.
  data_boundary:
    enabled: true
    mode: enforce
    classes:
      email:  {external: warn,  untrusted: block, unknown: warn}
      phone:  {external: warn,  untrusted: block, unknown: warn}
      ssn:    {trusted: block,  external: block,  untrusted: block, unknown: block}
      card:   {trusted: block,  external: block,  untrusted: block, unknown: block}
      iban:   {trusted: warn,   external: block,  untrusted: block, unknown: block}
      secret: {trusted: warn,   external: block,  untrusted: block, unknown: block}
      file:   {external: warn,  untrusted: block, unknown: warn}

  tool_tags:
    enabled: true
    mode: enforce

rules:
  # A CI job that installs from a URL or a git ref has stepped outside the
  # lockfile — in a pipeline that is a release-integrity failure, not a warning.
  - id: pkg-install-from-url
    mode: enforce
  - id: npm-git-install
    mode: enforce
  - id: execute-vendored-script
    mode: enforce
  - id: lockfile-direct-edit
    mode: enforce

  # Persistence on a runner is either pointless or an attack. Ephemeral runners
  # throw the box away; long-lived ones must not accumulate cron jobs and
  # shell-profile edits from a build.
  - id: persistence-cron
    mode: enforce
  - id: persistence-systemd
    mode: enforce
  - id: persistence-shell-profile
    mode: enforce
  - id: persistence-git-hooks
    mode: enforce

  # Disabling TLS verification to "make the build pass" is how a MITM becomes
  # permanent. Never a warning here.
  - id: tls-verification-disabled
    mode: enforce

# ── Customize ───────────────────────────────────────────────────────────────
# Add your own hosts — an internal artifact registry, a status webhook:
#
# settings:
#   egress:
#     allow:
#       - "artifacts.mycorp.internal"
#       - host: "hooks.slack.com"
#         reason: "build notifications"
#
# `egress.allow` is a list, so restating it in your own policy REPLACES the
# list above rather than appending to it — copy the entries you still want.
# Nested maps (`data_boundary.classes`, `egress.agents`) merge key by key.
#
# Deploy jobs that legitimately read cloud instance metadata need the deny
# entry removed explicitly; it is a default, not a hardcoded block. See
# docs/policy-templates.md.
