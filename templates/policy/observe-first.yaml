# Prismor policy template — Observe First
# summary: Measure before you enforce. Logs everything, blocks nothing but the safety floor.
#
# Use when: you are rolling Prismor out to a team and do not yet know what your
# agents actually do. Run for a week, then read the telemetry:
#
#     prismor sessions              # what was screened
#     prismor egress report         # every destination your agents contacted
#     prismor policy show           # the merged, effective ruleset
#
# and graduate to one of the enforcing templates once the noise is understood.
#
# What still blocks: the non-overridable safety floor (rm -rf /, reverse
# shells, secret exfiltration, privilege escalation, tampering with Prismor
# itself). No policy file can turn those off — observe-first is about your
# rules, not about leaving the machine undefended.
version: "1.0"

settings:
  # Every rule that does not declare its own mode observes instead of blocking.
  default_mode: observe

  # Egress: watch, do not gate. `default: allow` + observe means every
  # destination is recorded and nothing is refused. This is the data you need
  # before writing an allowlist — do not guess it.
  egress:
    enabled: true
    mode: observe
    default: allow

  # Data boundary: record which sensitive values are leaving and where, without
  # interrupting anyone. `observe` never blocks and never prompts.
  data_boundary:
    enabled: true
    mode: observe

  # Tool-combination governance in observe: logs when a session completes a
  # forbidden tag combination (untrusted read -> critical action) so you can
  # tune tags against real sessions before the block is real.
  tool_tags:
    enabled: true
    mode: observe
    # Matches the enforcing templates, so what you measure here predicts what
    # they will do. With inference on, every shell/write is `critical_action`
    # and every read `untrusted_content`, and the log fills with combinations
    # that are just "the agent did two things".
    inference_enabled: false

  # Inspected script/Makefile/Dockerfile content is reported with file:line
  # provenance but never blocks. Already the default; restated so this file
  # reads as a complete posture.
  execution_target_action: observe

  mcp_transport_action: warn

rules: []

# ── Customize ───────────────────────────────────────────────────────────────
# Promote one rule at a time as you gain confidence, instead of flipping the
# whole policy:
#
# rules:
#   - id: secret-access
#     mode: enforce
#   - id: db-modification
#     mode: enforce
#
# Silence a rule that is wrong for this repo (an allowlist is narrower and more
# auditable than disabling the rule outright):
#
# allowlists:
#   - id: allow-fixture-secrets
#     rule_ids: ["secret-access"]
#     patterns: ["tests/fixtures/"]
#     reason: "checked-in fixtures, no real credentials"
