# Prismor policy template — Production Ops
# summary: Agent with real infrastructure credentials. Blast radius, not malware.
#
# Use when: the agent has a cloud profile, a kubeconfig, a Terraform state
# backend, or a production database URL in reach. The threat model inverts here.
# There is no attacker in the usual case — there is a competent agent executing
# a correct-looking command against the wrong environment, at the wrong scale,
# with credentials that make it irreversible.
#
# So the rules below are not about detecting malice. They are about the
# handful of verbs that cannot be undone: destroy, delete, terminate, drop,
# force-push. Everything else stays out of the way.
#
# The environment split is the load-bearing part: the same `kubectl delete`
# is routine in staging and a career event in prod. Prismor cannot infer which
# cluster you are pointed at, so the patterns below key on the naming
# convention in the command itself — replace `prod|production` with whatever
# your fleet actually calls it.
version: "1.0"

settings:
  default_mode: enforce

  egress:
    enabled: true
    mode: enforce
    default: deny
    allow_private: true
    allow:
      - "*.amazonaws.com"
      - "*.googleapis.com"
      - "*.azure.com"
      - "*.windows.net"
      - "*.digitaloceanspaces.com"
      - "*.hashicorp.com"
      - "registry.terraform.io"
      - "*.github.com"
      - "github.com"
      - "*.datadoghq.com"
      - "*.pagerduty.com"
      - "hooks.slack.com"
      - "api.anthropic.com"
      - "api.openai.com"
    # The metadata endpoints are denied by default. An ops agent is exactly the
    # one that might legitimately read instance tags — if so, remove the entry
    # deliberately rather than disabling egress screening wholesale.

  # `terraform apply -auto-approve` inside a wrapper script is invisible to a
  # rule that only sees `./deploy.sh`. Resolve and screen the target.
  inspect_execution_targets: true
  execution_target_action: enforce

  tool_tags:
    enabled: true
    mode: enforce
    rules:
      # A ticket, alert or runbook page is untrusted input. Acting on it with
      # production credentials in the same session is the sequence to stop.
      - "untrusted_content then critical_action -> block"

  data_boundary:
    enabled: true
    mode: enforce

rules:
  - id: db-modification
    mode: enforce
  - id: db-access
    mode: enforce
    action: block
  - id: cloud-metadata-ssrf
    mode: enforce
  - id: container-escape
    mode: enforce

  # ── Irreversible infrastructure verbs ──────────────────────────────────────
  - id: terraform-destroy
    severity: CRITICAL
    category: destructive_command
    title: Terraform destroy or unreviewed auto-approve
    event_types: [shell]
    fields: [command]
    patterns:
      - '\bterraform\s+(?:-[^\s]+\s+)*destroy\b'
      - '\bterraform\s+(?:-[^\s]+\s+)*apply\b[^\n]*\s-auto-approve\b'
      - '\bterraform\s+state\s+rm\b'
      - '\bterragrunt\s+(?:run-all\s+)?destroy\b'
    action: block

  - id: k8s-prod-destructive
    severity: CRITICAL
    category: destructive_command
    title: Destructive kubectl against a production-named context or namespace
    event_types: [shell]
    fields: [command]
    patterns:
      - '\bkubectl\b[^\n]*\s(?:--context|--namespace|-n)[=\s]+[^\s]*(?:prod|production)[^\s]*[^\n]*\s(?:delete|drain|cordon)\b'
      - '\bkubectl\s+delete\b[^\n]*\s(?:--all|--all-namespaces)\b'
      - '\bkubectl\s+delete\s+(?:namespace|ns)\s+[^\s]*(?:prod|production)'
      - '\bhelm\s+(?:uninstall|delete)\b[^\n]*[^\s]*(?:prod|production)'
    action: block

  - id: cloud-terminate-resources
    severity: CRITICAL
    category: destructive_command
    title: Cloud CLI deleting or terminating live resources
    event_types: [shell]
    fields: [command]
    patterns:
      - '\baws\s+ec2\s+terminate-instances\b'
      - '\baws\s+rds\s+delete-db-(?:instance|cluster)\b'
      - '\baws\s+s3\s+rb\b[^\n]*--force\b'
      - '\baws\s+s3\s+rm\b[^\n]*\s--recursive\b'
      - '\baws\s+iam\s+delete-(?:user|role|policy)\b'
      - '\bgcloud\s+(?:compute\s+instances|sql\s+instances)\s+delete\b'
      - '\baz\s+(?:vm|group)\s+delete\b'
    action: block

  - id: prod-db-drop
    severity: CRITICAL
    category: db_modification
    title: Schema-destroying SQL against a production-named target
    event_types: [shell]
    fields: [command]
    patterns:
      - '(?:psql|mysql|mongo|mongosh|redis-cli)\b[^\n]*(?:prod|production)[^\n]*\b(?:DROP|TRUNCATE|DELETE\s+FROM)\b'
      - '\b(?:DROP\s+(?:DATABASE|SCHEMA|TABLE)|TRUNCATE\s+TABLE)\b[^\n]*(?:prod|production)'
      - '\bprisma\s+migrate\s+reset\b'
      - '\bflushall\b|\bFLUSHALL\b'
    action: block

  - id: git-history-rewrite-protected
    severity: HIGH
    category: destructive_command
    title: Force-push or history rewrite on a protected branch
    event_types: [shell]
    fields: [command]
    patterns:
      - '\bgit\s+push\b[^\n]*(?:--force(?!-with-lease)|\s-f\b)[^\n]*\b(?:main|master|release|production)\b'
      - '\bgit\s+push\b[^\n]*\s--delete\b[^\n]*\b(?:main|master|release|production)\b'
    action: block

# ── Customize ───────────────────────────────────────────────────────────────
# 1. Every pattern above keys on the literal strings `prod` / `production`. If
#    your environments are `live`, `p0`, or account IDs, edit the alternations —
#    otherwise these rules match nothing and this template is decoration.
#    Patterns are ONE alternation across all listed fields, so keep each rule's
#    patterns about a single subject; split a rule rather than widening it.
#
# 2. Verify against commands your team really runs before enforcing:
#
#      prismor check "kubectl --context prod-eu delete pod api-7f9"
#      prismor policy test --file .prismor/policy-tests.yaml
#
# 3. Add a narrow allowlist for the one workflow that has to survive, instead of
#    weakening the rule for everything:
#
#    allowlists:
#      - id: allow-ephemeral-preview-teardown
#        rule_ids: ["k8s-prod-destructive"]
#        patterns: ["--namespace preview-prod-[0-9]+"]
#        reason: "per-PR preview namespaces, torn down by the deploy bot"
#        expires: "2027-01-01T00:00:00Z"
