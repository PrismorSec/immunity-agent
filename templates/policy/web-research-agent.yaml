# Prismor policy template — Web / Research Agent
# summary: Agent that reads the open web. Assumes every fetched page is hostile input.
#
# Use when: the agent browses, scrapes, reads issues/emails/tickets, or feeds
# retrieved documents back into its own context. The threat here is not the
# agent — it is the page. A fetched README, a GitHub issue, a support ticket or
# a scraped product page can carry instructions, and the model has no reliable
# way to tell those apart from yours.
#
# The defence is not "detect the injection" (regexes lose that race). It is to
# bound what a session may DO after it has read untrusted input: the tag rules
# below stop the sequence, whatever wording convinced the model.
#
# Egress stays permissive-but-watched — a research agent has to reach hosts you
# cannot enumerate in advance. What is NOT permitted is reading an untrusted
# page and then sending somewhere off-list, which the tag rules catch by
# sequence rather than by destination list.
version: "1.0"

settings:
  default_mode: enforce

  egress:
    enabled: true
    mode: enforce
    default: allow               # research needs the open web; see rules below
    deny:
      - host: "169.254.0.0/16"
        reason: "cloud metadata / link-local — an SSRF pivot, never research"
      - host: "*.pastebin.com"
        reason: "classic exfil sink"
      - host: "*.requestbin.com"
        reason: "classic exfil sink"
      - host: "*.ngrok.io"
        reason: "ad-hoc tunnel endpoint"
      - host: "*.trycloudflare.com"
        reason: "ad-hoc tunnel endpoint"
      - host: "*.burpcollaborator.net"
        reason: "out-of-band exfil canary"
      - host: "*.oast.fun"
        reason: "out-of-band exfil canary"

  # The core control for this shape of agent.
  tool_tags:
    enabled: true
    mode: enforce
    defaults_enabled: true       # WebFetch/WebSearch/mcp read_* are pre-tagged
    inference_enabled: true      # untagged tools get a tag from their event type
    rules:
      # The generalized lethal trifecta: read untrusted -> then act critically.
      - "untrusted_content then critical_action -> block"
      # Read untrusted -> then send anywhere the fleet never approved. Catches
      # the exfil path even when the tool is a perfectly ordinary Bash curl.
      - "untrusted_content then egress.offlist -> block"
      - "untrusted_content then egress.denied -> block"
      # Read untrusted -> then ship a sensitive datum outside. Destination-aware,
      # so summarising a page into a local file is untouched.
      - "untrusted_content then data.secret -> block"
      - "untrusted_content then data.email with dest.external -> block"
    tags:
      # Tag your own MCP tools here. Names are matched exactly or by glob.
      # mcp__browser__navigate: [untrusted_content]
      # mcp__notion__search:    [untrusted_content]
      # mcp__slack__post:       [critical_action]
      {}

  # A page that says "run this to continue" is the whole attack. Content behind
  # an indirection (a downloaded script, a Makefile target) is screened too.
  inspect_execution_targets: true
  execution_target_action: enforce

  # Regex catches the copy-pasted injection; the contextual layer catches the
  # paraphrase. `auto` escalates only the uncertain zone (~2% of events).
  semantic_guard:
    enabled: true
    mode: auto

  data_boundary:
    enabled: true
    mode: enforce

rules:
  # Hidden-text injection (zero-width, ANSI, white-on-white, HTML comments) is
  # already CRITICAL; make sure prompt-injection findings block rather than warn
  # for an agent whose whole job is ingesting other people's text.
  - id: prompt-injection
    mode: enforce
  - id: prompt-injection-hidden
    mode: enforce
  - id: memory-embedded-directive
    mode: enforce
  - id: memory-exfil-directive
    mode: enforce
  - id: memory-tool-policy-override
    mode: enforce

  # "Fetch this and pipe it to a shell" — the single most common outcome of a
  # successful web injection.
  - id: fetch-then-execute
    mode: enforce
  - id: remote-execution
    mode: enforce

# ── Customize ───────────────────────────────────────────────────────────────
# The tag rules are the part worth tuning; the rest is scaffolding.
#
#   prismor tags list          # tools seen in your sessions + their resolved tags
#   prismor tags set mcp__jira__get_issue untrusted_content
#   prismor tags test          # dry-run the rules against recorded sessions
#   prismor tags lint          # validate rule grammar before shipping
#
# Grammar: TAG (then|with TAG)* [-> block|warn]
#   `then` = ordered sequence within a session
#   `with` = unordered co-occurrence
#
# Start any new rule at `-> warn`, run `prismor tags test` against a week of
# real sessions, and promote it to `block` only once it stops firing on work
# your team actually does.
