# Prismor — integration registry
#
# Machine-readable map of every agent / framework Prismor can intercept, the
# surface it exposes, and how blocking works there. This is the source of truth
# for the coverage tables in AGENT_INTEGRATIONS.md (regenerated by
# scripts/gen_integration_matrix.py) and for runtime adapter wiring.
#
# Fields:
#   id          stable identifier (matches _SUPPORTED_AGENTS / adapter agent name)
#   name        human-readable name
#   kind        coding-agent | framework
#   surface     hook-config | sdk | mcp | rules-only
#   status      shipped | roadmap | sweep-only
#   config_paths   {project, user, system} config locations (where applicable)
#   events      lifecycle events hooked
#   blocking    exit-2 | json-permission | throw | proxy-deny | none
#   normalizer  prismor/runtime/hooks.py function (coding agents) or adapter module (frameworks)
#   sweep_dir   config dir scanned by `immunity sweep` (optional)
#   sources     authoritative URLs
#
# Validate with: scripts/verify_registry.sh

schema: prismor.runtime.integrations.v1

agents:
  # ── Coding agents — shipped ──────────────────────────────────────────────
  - id: claude
    name: Claude Code
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".claude/settings.json", user: "~/.claude/settings.json" }
    events: [UserPromptSubmit, PreToolUse, PostToolUse]
    blocking: exit-2
    normalizer: _normalize_claude
    sweep_dir: "~/.claude/"
    sources: ["https://docs.claude.com/en/docs/claude-code/hooks"]

  - id: cursor
    name: Cursor
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".cursor/hooks.json" }
    events: [beforeSubmitPrompt, beforeShellCommand, afterShellCommand, beforeFileWrite, afterFileWrite]
    blocking: json-permission
    normalizer: _normalize_cursor
    sweep_dir: "~/.config/Cursor/"
    sources: ["https://cursor.com/docs/agent/hooks"]

  - id: windsurf
    name: Windsurf (Codeium Cascade)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".windsurf/hooks.json", user: "~/.codeium/windsurf/hooks.json" }
    events: [pre_user_prompt, pre_read_code, post_read_code, pre_write_code, post_write_code, pre_run_command, post_run_command, pre_mcp_tool_use, post_mcp_tool_use, post_cascade_response]
    blocking: json-permission
    normalizer: _normalize_windsurf
    sweep_dir: "~/.codeium/"
    sources: ["https://docs.windsurf.com/windsurf/cascade/hooks"]

  - id: openclaw
    name: OpenClaw
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { user: "~/.openclaw/config.json" }
    events: [before_tool_call, message_sending, "message:received"]
    blocking: throw
    normalizer: _normalize_openclaw
    sweep_dir: "~/.openclaw/"
    sources: ["internal"]

  - id: hermes
    name: Hermes (NousResearch gateway)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { user: "~/.hermes/config.json" }
    events: [before_tool_call, message_sending, "message:received"]
    blocking: throw
    normalizer: _normalize_hermes
    sweep_dir: "~/.hermes/"
    sources: ["internal"]

  - id: codex
    name: Codex (OpenAI)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".codex/hooks.json", user: "~/.codex/hooks.json" }
    events: [UserPromptSubmit, PreToolUse, PermissionRequest, PostToolUse]
    blocking: exit-2
    normalizer: _normalize_codex
    sweep_dir: "~/.codex/"
    notes: "Requires codex-cli >= 0.141.0-alpha.1 for working hooks."
    sources: ["https://developers.openai.com/codex/hooks"]

  - id: copilot
    name: GitHub Copilot CLI
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".github/copilot/hooks.json", user: "~/.copilot/hooks.json" }
    events: [UserPromptSubmitted, PreToolUse, PostToolUse]
    blocking: json-permission
    normalizer: _normalize_copilot
    sources: ["https://docs.github.com/en/copilot/reference/hooks-configuration"]

  - id: grok
    name: Grok Build (xAI)
    kind: coding-agent
    surface: hook-config
    status: shipped
    config_paths: { project: ".grok/hooks/prismor.json", user: "~/.grok/hooks/prismor.json" }
    events: [UserPromptSubmit, PreToolUse, PostToolUse]
    blocking: exit-2
    normalizer: _normalize_grok
    sweep_dir: "~/.grok/"
    notes: "Also natively reads .claude/settings.json and .cursor/hooks.json. Tool-name matchers assume Claude-Code-compatible tool names (Bash/Read/Edit/Write/...) by analogy; not yet verified against a live grok binary."
    sources: ["https://docs.x.ai/build/features/hooks", "https://docs.x.ai/build/overview"]

  # ── Coding agents — roadmap (hook surface exists, adapter not built) ──────
  - id: gemini
    name: Gemini CLI (Google)
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".gemini/settings.json", user: "~/.gemini/settings.json", system: "/etc/gemini-cli/settings.json" }
    events: [BeforeTool, AfterTool, BeforeAgent, AfterAgent, BeforeModel, BeforeToolSelection, AfterModel, SessionStart, SessionEnd]
    blocking: exit-2
    normalizer: null
    sources: ["https://geminicli.com/docs/hooks/reference/"]

  - id: opencode
    name: OpenCode
    kind: coding-agent
    surface: sdk
    status: roadmap
    config_paths: { project: ".opencode/plugins/", user: "~/.config/opencode/plugins/" }
    events: ["tool.execute.before", "tool.execute.after"]
    blocking: throw
    normalizer: null
    sources: ["https://opencode.ai/docs/plugins/"]

  - id: kiro
    name: Kiro (AWS)
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".kiro/hooks/", user: "~/.kiro/" }
    events: [preToolUse, postToolUse]
    blocking: exit-2
    normalizer: null
    sources: ["https://kiro.dev/docs/cli/hooks/"]

  - id: factory-droid
    name: Factory Droid
    kind: coding-agent
    surface: hook-config
    status: roadmap
    config_paths: { project: ".factory-plugin/hooks/hooks.json", user: "~/.factory/" }
    events: [PreToolUse, PostToolUse]
    blocking: json-permission
    normalizer: null
    sources: ["https://docs.factory.ai/reference/hooks-reference"]

  # ── Sweep / rules-only — no programmable pre-tool hook ────────────────────
  - id: antigravity
    name: Google Antigravity
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { user: "~/.antigravity/" }
    events: []
    blocking: none
    normalizer: null
    sweep_dir: "~/.antigravity/"
    sources: ["https://discuss.ai.google.dev/t/hooks-in-antigravity/120458"]

  - id: aider
    name: Aider
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { project: ".aider.conf.yml", user: "~/.aider/" }
    events: []
    blocking: none
    normalizer: null
    sweep_dir: "~/.aider/"
    sources: ["https://aider.chat/docs/config/options.html"]

  - id: trae
    name: Trae / Trae CN (ByteDance)
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { project: ".trae/rules/", user: "~/.trae/" }
    events: []
    blocking: none
    normalizer: null
    sweep_dir: "~/.trae/"
    sources: ["https://docs.trae.ai/ide/rules?_lang=en"]

  - id: kilocode
    name: Kilocode
    kind: coding-agent
    surface: rules-only
    status: sweep-only
    config_paths: { project: ".kilocode/rules/", user: "~/.kilocode/" }
    events: ["session.chat.before"]
    blocking: none
    normalizer: null
    sweep_dir: "~/.kilocode/"
    notes: "Soft only — can inject a guardrail prompt, cannot veto a tool call."
    sources: ["https://deepwiki.com/Kilo-Org/kilocode/6.3-tool-filtering-and-permissions"]

  # ── Production frameworks — in-process SDK adapters ──────────────────────
  - id: openai-agents
    name: OpenAI Agents SDK
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [tool_call]
    blocking: throw
    normalizer: "prismor_openai"
    notes: "In-process tool wrapper / guardrail. pip install prismor-openai."
    sources: ["https://openai.github.io/openai-agents-python/"]

  - id: crewai
    name: CrewAI
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [tool_call]
    blocking: throw
    normalizer: "prismor_crewai"
    notes: "In-process tool wrapper (func/_run/run). pip install prismor-crewai."
    sources: ["https://docs.crewai.com/"]

  - id: langchain
    name: LangChain / LangGraph
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [on_tool_start, on_tool_end]
    blocking: throw
    normalizer: "prismor_langchain"
    notes: "Tool wrapper + PrismorCallbackHandler. pip install prismor-langchain."
    sources: ["https://python.langchain.com/docs/concepts/callbacks/"]

  - id: browser-use
    name: browser-use
    kind: framework
    surface: sdk
    status: shipped
    config_paths: {}
    events: [go_to_url, click_element, input_text, search_google, open_tab, upload_file, save_pdf, extract_content]
    blocking: throw
    normalizer: "prismor_browser_use"
    notes: "Patches Registry.execute_action — single dispatch point for all browser actions. go_to_url/search_google → network event; upload_file/save_pdf → file_write; everything else → shell. pip install prismor-browser-use."
    sources: ["https://github.com/browser-use/browser-use"]

  # ── Vercel AI SDK (TypeScript, via HTTP eval-server) ─────────────────────
  - id: vercel-ai
    name: Vercel AI SDK
    kind: framework
    surface: http
    status: shipped
    config_paths: {}
    events: [tool_call]
    blocking: throw
    normalizer: null
    notes: "TypeScript prismorTool/prismorTools wraps tool.execute(); calls POST /v1/evaluate on the eval-server sidecar before each tool runs. Fails open if eval-server is unreachable. npm install prismor-vercel."
    sources: ["https://sdk.vercel.ai/docs/foundations/tools"]

  # ── HTTP eval-server (language-agnostic) ──────────────────────────────────
  - id: eval-server
    name: HTTP Eval-Server (any language)
    kind: framework
    surface: http
    status: shipped
    config_paths: {}
    events: [tool_call]
    blocking: client-side
    normalizer: null
    notes: "Sidecar HTTP server (immunity eval-server --port 7071). POST /v1/evaluate accepts tool name/args/subject/mode, runs full evaluate_tool_call pipeline, returns Decision JSON. Any language with an HTTP client works as adapter. Validated: Node.js, Ruby, Java 21, Rust."
    sources: []

  # ── Universal — MCP proxy (follow-on) ────────────────────────────────────
  - id: mcp-proxy
    name: MCP Proxy (any MCP-speaking agent)
    kind: framework
    surface: mcp
    status: roadmap
    config_paths: {}
    events: ["tools/call"]
    blocking: proxy-deny
    normalizer: null
    notes: "stdio/HTTP shim in front of downstream MCP servers; covers any MCP client."
    sources: ["https://modelcontextprotocol.io/"]
