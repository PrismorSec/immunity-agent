[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor-semantic-kernel"
version = "0.1.0"
description = "Prismor adapter for Semantic Kernel (Microsoft) — per-user runtime tool-call policy for production agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prismor" }]
keywords = ["semantic-kernel", "security", "policy", "guardrail", "prismor"]

dependencies = [
    "prismor>=1.13.0",
]

[project.optional-dependencies]
semantic-kernel = ["semantic-kernel>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["prismor_semantic_kernel", "prismor"]
