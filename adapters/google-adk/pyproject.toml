[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor-google-adk"
version = "0.1.0"
description = "Prismor adapter for Google Agent Development Kit (ADK) — per-user runtime tool-call policy for production agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prismor" }]
keywords = ["google-adk", "adk", "security", "policy", "guardrail", "prismor"]

dependencies = [
    "prismor>=1.13.0",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["prismor_google_adk", "prismor"]
